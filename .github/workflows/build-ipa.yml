name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Expo Prebuild
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods Dependencies
        run: |
          cd ios
          pod install
          cd ..

      - name: Build Unsigned App
        run: |
          cd ios
          xcodebuild -workspace runningcoachapp.xcworkspace \
            -scheme runningcoachapp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath $RUNNER_TEMP/build \
            -destination 'generic/platform=iOS' \
            build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS=""

      - name: Package into IPA
        run: |
          mkdir -p $RUNNER_TEMP/Payload
          cp -r $RUNNER_TEMP/build/Build/Products/Release-iphoneos/*.app $RUNNER_TEMP/Payload/
          cd $RUNNER_TEMP
          zip -r runningcoachapp-unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: runningcoachapp-unsigned-ipa
          path: $RUNNER_TEMP/runningcoachapp-unsigned.ipa
