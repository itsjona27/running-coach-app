name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Expo Prebuild
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods Dependencies
        run: |
          cd ios
          pod install
          cd ..

      - name: Build Unsigned IPA
        run: |
          xcodebuild -workspace ios/runningcoachapp.xcworkspace \
            -scheme runningcoachapp \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $RUNNER_TEMP/runningcoachapp.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          mkdir -p $RUNNER_TEMP/Payload
          cp -r $RUNNER_TEMP/runningcoachapp.xcarchive/Products/Applications/*.app $RUNNER_TEMP/Payload/

          cd $RUNNER_TEMP
          zip -r runningcoachapp-unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: runningcoachapp-unsigned-ipa
          path: $RUNNER_TEMP/runningcoachapp-unsigned.ipa
